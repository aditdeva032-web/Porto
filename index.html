<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVA AS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #00ff9c;
      font-family: "Courier New", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    #matrix {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      opacity: 0.35;
    }

    /* ===== Judul Glitch ===== */
    .glitch {
      position: relative;
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 6px;
      color: #fff;
      margin-bottom: 25px;
      text-shadow: 0 0 10px #00ff9c, 0 0 25px #00ff9c;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      overflow: hidden;
    }
    .glitch::before {
      color: #ff003c;
      left: 2px;
      animation: glitch1 2s infinite linear alternate-reverse;
    }
    .glitch::after {
      color: #00e5ff;
      left: -2px;
      animation: glitch2 2.5s infinite linear alternate-reverse;
    }
    @keyframes glitch1 {
      0%   { clip-path: inset(10% 0 80% 0); }
      20%  { clip-path: inset(60% 0 20% 0); }
      40%  { clip-path: inset(30% 0 50% 0); }
      60%  { clip-path: inset(80% 0 5% 0); }
      80%  { clip-path: inset(5% 0 85% 0); }
      100% { clip-path: inset(45% 0 40% 0); }
    }
    @keyframes glitch2 {
      0%   { clip-path: inset(70% 0 10% 0); }
      25%  { clip-path: inset(15% 0 70% 0); }
      50%  { clip-path: inset(50% 0 30% 0); }
      75%  { clip-path: inset(25% 0 60% 0); }
      100% { clip-path: inset(85% 0 5% 0); }
    }

    /* ===== Terminal ===== */
    .terminal {
      width: 100%;
      max-width: 460px;
      background: rgba(0, 10, 5, 0.85);
      border: 1px solid #00ff9c;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 255, 156, 0.35);
      overflow: hidden;
    }
    .bar {
      background: #0b1f16;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #00ff9c55;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .r { background: #ff5f56; }
    .y { background: #ffbd2e; }
    .g { background: #27c93f; }
    .title { margin-left: 8px; font-size: 12px; color: #7dffc8; }

    .body { padding: 18px; font-size: 14px; line-height: 1.8; min-height: 170px; }
    .cmd { color: #00ff9c; }
    .out { color: #fff; }
    .name { color: #ffe600; font-weight: bold; }

    .cursor {
      display: inline-block;
      width: 8px; height: 16px;
      background: #00ff9c;
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ===== Tombol Link ===== */
    .links {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 0 18px 20px;
    }
    .links.show { display: flex; animation: fade 0.8s ease; }
    @keyframes fade {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btn {
      display: block;
      text-align: center;
      padding: 13px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-family: inherit;
      letter-spacing: 1px;
      border: 2px solid;
      background: transparent;
      transition: 0.25s;
    }
    .wa     { color: #25D366; border-color: #25D366; }
    .tiktok { color: #00f2ea; border-color: #00f2ea; }
    .ig     { color: #ff4fa3; border-color: #ff4fa3; }

    .wa:hover     { background: #25D366; color: #000; box-shadow: 0 0 20px #25D366; }
    .tiktok:hover { background: #00f2ea; color: #000; box-shadow: 0 0 20px #00f2ea; }
    .ig:hover     { background: #ff4fa3; color: #000; box-shadow: 0 0 20px #ff4fa3; }
    .btn:hover { transform: scale(1.04); }

    .footer { margin-top: 18px; font-size: 12px; color: #00ff9c99; }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <h1 class="glitch" data-text="DEVA AS">DEVA AS</h1>

  <div class="terminal">
    <div class="bar">
      <span class="dot r"></span>
      <span class="dot y"></span>
      <span class="dot g"></span>
      <span class="title">deva@termux:~</span>
    </div>

    <div class="body" id="terminal"></div>

    <div class="links" id="links">
      <a class="btn wa" href="https://wa.me/6282175305740" target="_blank">[ WhatsApp ]</a>
      <a class="btn tiktok" href="https://www.tiktok.com/@manusia_biasa093?_r=1&amp;_t=ZS-9AtclFRLGw0" target="_blank">[ TikTok ]</a>
      <a class="btn ig" href="https://www.instagram.com/user.unkown0007?cplk=aWUzcTM3YTd5M2o0" target="_blank">[ Instagram ]</a>
    </div>
  </div>

  <p class="footer">&lt;/&gt; coded by DEVA AS</p>

  <script>
    /* ===== 1. Hujan kode Matrix ===== */
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ{}[]<>/=+*#$%".split("");
    const size = 16;
    let drops = [];

    function initDrops() {
      drops = Array(Math.floor(canvas.width / size)).fill(1);
    }
    initDrops();
    window.addEventListener("resize", initDrops);

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#00ff9c";
      ctx.font = size + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * size, drops[i] * size);
        if (drops[i] * size > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 45);

    /* ===== 2. Terminal mengetik otomatis ===== */
    const term = document.getElementById("terminal");
    const links = document.getElementById("links");

    const script = [
      { text: "$ whoami", cls: "cmd" },
      { text: "DEVA AS", cls: "name" },
      { text: "$ cat bio.txt", cls: "cmd" },
      { text: "Coder | Creator | Selalu Belajar", cls: "out" },
      { text: "$ ls kontak/", cls: "cmd" },
      { text: "whatsapp  tiktok  instagram", cls: "out" }
    ];

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    async function typeLine(item) {
      const line = document.createElement("div");
      line.className = item.cls;
      term.appendChild(line);

      for (const ch of item.text) {
        line.textContent += ch;
        await sleep(item.cls === "cmd" ? 70 : 35);
      }
      await sleep(350);
    }

    async function run() {
      const cursor = document.createElement("span");
      cursor.className = "cursor";

      for (const item of script) {
        await typeLine(item);
      }

      term.appendChild(cursor);
      await sleep(400);
      links.classList.add("show");
    }
    run();
  </script>

</body>
</html>
